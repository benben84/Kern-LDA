[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kern-lda"
version = "0.1.0"
description = "Multiclass Kernel Linear Discriminant Analysis (Kernel Fisher Discriminant Analysis)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
demo = ["matplotlib>=3.7"]
test = ["pytest>=7.4"]

[tool.setuptools]
packages = ["kern_lda"]

[tool.pytest.ini_options]
testpaths = ["tests"]
